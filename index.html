<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5FA">
<meta name="description" content="词语小侦探：近义词·反义词学习软件，会辨析、能训练、有反馈。纯本地离线运行。">
<title>词语小侦探 · 近义词反义词训练器</title>
<style>
/* ============================================================
   设计变量（P7：全站统一引用，禁止散落硬编码色值）
   ============================================================ */
:root{
  --brand:#F2784B;            /* 暖橙：进度、强调、边框 */
  --brand-strong:#C9481A;     /* 深橙：主按钮实底（保证白字对比度 ≥4.5:1） */
  --brand-deep:#A2431F;       /* 橙棕：浅橙底上的文字 */
  --brand-light:#FDEBE3;
  --info:#4A9BD1;             /* 天蓝：链接、次级 */
  --info-light:#E3F1FA;
  --success:#3FA96B;
  --success-light:#E4F4EA;  --ok-text:#1F6B44;
  --danger:#D9534F;
  --danger-light:#FAE7E6;   --no-text:#A33633;
  --warn-bg:#FFF6E5; --warn-line:#F0E2BC; --warn-text:#7A5A16;
  --neutral-bg:#EFECE8; --neutral-text:#6B655F;
  --bg:#FDF8F3;               /* 米白底 */
  --card:#FFFFFF;
  --text:#2E2A27;             /* 对比度 ≥7:1 */
  --text-sub:#7A736D;         /* ≥4.5:1 */
  --line:#EDE5DC;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --radius:16px;
}
[data-theme="dark"]{
  --brand:#F28A5F; --brand-strong:#C9481A; --brand-deep:#FFB899; --brand-light:#3B2A21;
  --info:#5FA8D8; --info-light:#20303C;
  --success:#4CB67C; --success-light:#203328; --ok-text:#8FD4AE;
  --danger:#E06A66; --danger-light:#3D2625; --no-text:#F0A9A6;
  --warn-bg:#3A3220; --warn-line:#55482A; --warn-text:#E8D9A8;
  --neutral-bg:#332F2B; --neutral-text:#A89F96;
  --bg:#1E1B18; --card:#2A2622; --text:#F0EAE3; --text-sub:#A89F96; --line:#3A342E;
  --shadow:0 2px 12px rgba(0,0,0,.35);
}
/* ============================================================
   基础排版（正文 ≥17px，行高 1.7，儿童阅读优先）
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:17px;line-height:1.7;color:var(--text);background:var(--bg);min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--info);text-decoration:none}
ul,ol{list-style:none}
mark{background:#FFE9A8;color:inherit;border-radius:3px;padding:0 2px}
[data-theme="dark"] mark{background:#5C4A1E;color:#F5E9C8}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
#app{max-width:1080px;margin:0 auto;padding:0 16px 48px}
/* ============================================================
   顶栏与 Tab 导航（图标必须配文字）
   ============================================================ */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:10px 4px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:20px;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{display:flex;align-items:center;gap:5px;padding:8px 12px;min-height:44px;
  border-radius:12px;color:var(--text-sub);white-space:nowrap;font-weight:600}
.tab:hover{color:var(--brand-deep)}
.tab.active{background:var(--brand-light);color:var(--brand-deep)}
/* 移动端：标签栏移到屏幕底部（仿 App 导航），避免顶部溢出 */
@media(max-width:700px){
  body{-webkit-tap-highlight-color:transparent}
  .topbar{padding:8px 12px;gap:8px}
  .brand{font-size:17px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:100;margin-left:0;gap:0;
    background:var(--card);border-top:1px solid var(--line);overflow:visible;
    padding:4px 0 calc(4px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(0,0,0,.06)}
  .tab{flex:1;flex-direction:column;gap:1px;justify-content:center;min-height:50px;
    font-size:12px;padding:4px 0 0;border-radius:0}
  .tab.active{background:transparent}
  main{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
}
/* ============================================================
   视图切换（淡入 + 8px 上移，250ms）
   ============================================================ */
.view{display:none;padding-top:16px}
.view.active{display:block;animation:fadeUp .25s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view-title{font-size:22px;font-weight:800;margin:4px 0 14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.muted{color:var(--text-sub);font-size:14px}
.foot{text-align:center;color:var(--text-sub);font-size:13px;padding:24px 0 8px}
/* ============================================================
   按钮体系（高 ≥44px，按下 scale(.97) 120ms）
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
  padding:8px 18px;border-radius:12px;font-weight:700;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand-strong);color:#fff}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{border:2px solid var(--brand);color:var(--brand-deep);background:transparent}
.btn-plain{border:1px solid var(--line);color:var(--text-sub);background:var(--card)}
.btn-small{min-height:38px;padding:4px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* ============================================================
   查词视图
   ============================================================ */
.searchbar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:var(--radius);
  background:var(--card);box-shadow:var(--shadow);margin-bottom:16px}
.searchbar input{flex:1;border:none;outline:none;background:transparent;font-size:18px;
  min-height:44px;color:var(--text);min-width:0}
.search-layout{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
#search-results{padding:8px}
.result-item{display:block;width:100%;text-align:left;padding:10px 12px;min-height:52px;border-radius:12px}
.result-item:hover,.result-item.sel{background:var(--brand-light)}
.result-line1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.result-word{font-weight:700;font-size:18px}
.result-py{color:var(--text-sub);font-size:14px;letter-spacing:1px}
.result-syn{display:block;color:var(--text-sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more-hint{padding:10px 12px;color:var(--text-sub);font-size:14px}
/* 详情卡 */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--info);min-height:44px;font-weight:600}
.d-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.d-word{font-size:34px;font-weight:800;line-height:1.3}
.d-py{font-size:14px;letter-spacing:2px;color:var(--text-sub);margin-top:2px}
.star-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 12px;
  border-radius:12px;color:var(--text-sub);font-weight:600;margin-left:auto}
.star-btn.on{color:var(--brand-deep)}
.star-btn.on .star-ico{display:inline-block;animation:starPop .2s}
@keyframes starPop{50%{transform:scale(1.3)}}
.d-meta{display:flex;gap:8px;align-items:center;margin:8px 0 4px;flex-wrap:wrap}
.meta-chip{font-size:13px;color:var(--text-sub);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.tagpill{font-size:13px;font-weight:600;border-radius:999px;padding:2px 12px}
.tagpill.biao{background:var(--success-light);color:var(--ok-text)}
.tagpill.zhong{background:var(--neutral-bg);color:var(--neutral-text)}
.tagpill.bian{background:var(--danger-light);color:var(--no-text)}
.d-def{font-size:19px;margin:12px 0;padding:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.sec-title{font-size:16px;font-weight:700;color:var(--text-sub);margin:14px 0 8px;letter-spacing:1px}
.pillrow{display:flex;flex-direction:column;gap:8px}
.pillitem{display:flex;flex-direction:column;align-items:flex-start;text-align:left;
  background:var(--brand-light);border-radius:12px;padding:8px 14px;min-height:44px}
.pillitem:hover{filter:brightness(1.02)}
.pillitem.ant{background:var(--info-light)}
.pill-word{font-weight:700;color:var(--brand-deep);font-size:17px}
.pillitem.ant .pill-word{color:var(--info)}
.pill-diff{font-size:14px;color:var(--text-sub);line-height:1.6}
.ex-list li{margin:6px 0}
.ex-num{color:var(--brand);font-weight:700;margin-right:6px}
.confuse-box{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;
  padding:10px 14px;margin-top:14px;color:var(--warn-text)}
.next-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.empty{padding:28px 12px;text-align:center;color:var(--text-sub)}
.empty .big{font-size:40px;margin-bottom:8px}
.reco-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-height:44px;
  background:var(--bg);font-weight:600}
.chip:hover{border-color:var(--brand);color:var(--brand-deep)}
.chip.on{background:var(--brand-light);border-color:var(--brand);color:var(--brand-deep)}
.daily-box{text-align:center;padding:8px 0}
.daily-box .d-word{cursor:pointer}
/* ============================================================
   辨析视图
   ============================================================ */
.vs-select{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;position:relative}
.picker{position:relative;flex:1;min-width:140px}
.picker input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:8px 12px;min-height:44px;outline:none}
.picker input:focus{border-color:var(--brand)}
.picker-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;background:var(--card);
  border-radius:12px;box-shadow:var(--shadow);padding:6px;max-height:260px;overflow:auto}
.picker-list button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;min-height:40px}
.picker-list button:hover{background:var(--brand-light)}
.vs-badge{font-weight:800;color:var(--brand);font-size:18px;padding:0 2px}
.vs-head{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px}
.vs-word{text-align:center}
.vs-word .w{font-size:34px;font-weight:800}
.vs-word .py{font-size:14px;letter-spacing:2px;color:var(--text-sub)}
.ct-table{width:100%;border-collapse:collapse;margin:12px 0;table-layout:fixed}
.ct-table th,.ct-table td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;word-break:break-word}
.ct-table th{background:var(--bg);font-size:14px;color:var(--text-sub);white-space:nowrap;width:88px}
.ct-table td{min-width:0}
.same-banner{background:var(--info-light);color:var(--info);border-radius:12px;padding:12px 16px;margin:12px 0;font-weight:600}
.scene-box{background:var(--bg);border-radius:12px;padding:12px 16px;margin-top:12px}
.scene-ctx{font-size:14px;color:var(--text-sub);margin-bottom:6px}
.scene-line{margin:6px 0}
.scene-conclusion{margin-top:8px;color:var(--text-sub);font-size:15px}
/* ============================================================
   闯关视图
   ============================================================ */
.quiz-wrap{max-width:760px;margin:0 auto}
.quiz-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.qprog{flex:1;min-width:120px;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.qprog-fill{height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.qcombo{font-weight:700;color:var(--brand-deep)}
.qcombo.hot{animation:comboPop .4s}
@keyframes comboPop{50%{transform:scale(1.15)}}
.q-prompt{font-size:22px;font-weight:700;text-align:center;margin:18px 0 6px}
.q-sentence{background:var(--bg);border-radius:12px;padding:12px 16px;text-align:center;margin:10px 0;font-size:18px}
.optgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
@media(max-width:700px){.optgrid{grid-template-columns:repeat(2,1fr)}}
.opt{position:relative;min-height:64px;border:2px solid var(--line);border-radius:14px;background:var(--card);
  font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:8px;transition:border-color .15s}
.opt:not(:disabled):hover{border-color:var(--brand)}
.opt.ok{border-color:var(--success);background:var(--success-light);color:var(--ok-text);animation:popOk .3s;transform:translateY(-2px)}
.opt.bad{border-color:var(--danger);background:var(--danger-light);color:var(--no-text);animation:shake .4s}
.opt.reveal{border-color:var(--success);background:var(--success-light);color:var(--ok-text)}
.opt.dim{opacity:.45}
.opt .ansmark{position:absolute;top:-12px;right:-6px;background:var(--ok-text);color:#fff;font-size:12px;
  padding:2px 8px;border-radius:999px;white-space:nowrap}
@keyframes popOk{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1) translateY(-2px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.fb{border-radius:12px;padding:12px 16px;margin-top:6px}
.fb-ok{background:var(--success-light);color:var(--ok-text)}
.fb-no{background:var(--danger-light);color:var(--no-text)}
.fb-title{font-weight:700}
.fb-body{margin-top:4px;font-size:15px}
.next-row-center{display:flex;justify-content:center;margin-top:14px}
.settle{text-align:center}
.stars{font-size:40px;letter-spacing:6px;margin:10px 0}
.score-line{font-size:18px;color:var(--text-sub)}
.wrong-list{text-align:left;margin:16px auto;max-width:560px}
.wrong-list li{background:var(--bg);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:15px}
.settle-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.mode-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 16px}
/* 填写作答 / 自动学习 */
.fill-row{display:flex;gap:10px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
.fill-row.locked{opacity:.75}
.fill-input{width:100%;max-width:420px;border:2px solid var(--line);border-radius:14px;
  padding:10px 14px;font-size:20px;text-align:center;min-height:52px;
  background:var(--card);color:var(--text)}
.fill-input:focus{border-color:var(--brand);outline:none}
.fill-input:disabled{opacity:.6}
.auto-word{text-align:center;margin:14px 0 4px}
.auto-word .d-word{font-size:44px;cursor:default}
.auto-answer{margin-top:14px;background:var(--bg);border-radius:12px;padding:12px 16px;
  opacity:0;transform:translateY(6px);transition:all .4s;text-align:left}
.auto-answer.revealed{opacity:1;transform:none}
.auto-controls{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
/* ============================================================
   词库浏览视图
   ============================================================ */
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-row select{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;min-height:44px}
.browse-layout{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:16px;align-items:start}
.letter-nav{position:sticky;top:70px;display:flex;flex-direction:column;gap:1px;background:var(--card);
  border-radius:12px;padding:6px 4px;box-shadow:var(--shadow);max-height:calc(100vh - 96px);overflow:auto}
.letter-nav button{width:100%;min-height:40px;font-size:13px;font-weight:700;color:var(--text-sub);border-radius:8px}
.letter-nav button:hover{color:var(--brand-deep);background:var(--brand-light)}
.letter-head{font-size:20px;font-weight:800;color:var(--brand-deep);margin:18px 0 4px;scroll-margin-top:80px}
.wrow{display:flex;align-items:center;gap:10px;padding:8px 6px;min-height:52px;
  border-bottom:1px dashed var(--line);width:100%;text-align:left;border-radius:8px}
.wrow:hover{background:var(--brand-light)}
.wrow .w{font-weight:700;font-size:18px;min-width:4.5em}
.wrow .py{color:var(--text-sub);font-size:14px;letter-spacing:1px;min-width:7.5em}
.wrow .def{color:var(--text-sub);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){
  .browse-layout{grid-template-columns:minmax(0,1fr)}
  .browse-layout>.card{min-width:0}
  .letter-nav{position:static;flex-direction:row;flex-wrap:wrap;max-height:none}
  .letter-nav button{width:auto;min-width:36px;padding:0 6px}
}
/* ============================================================
   我的视图
   ============================================================ */
.me-wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.statgrid{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}
.stat .num{font-size:22px;font-weight:800;color:var(--brand-deep)}
.stat .lbl{font-size:12px;color:var(--text-sub)}
.cal{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:10px}
@media(max-width:700px){.cal{grid-template-columns:repeat(10,1fr)}}
.cal-cell{aspect-ratio:1;border-radius:4px;background:var(--line);min-width:0}
.cal-cell.on{background:var(--brand)}
.cal-cell.today{outline:2px solid var(--info);outline-offset:1px}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 4px;min-height:52px;
  border-bottom:1px dashed var(--line);flex-wrap:wrap}
.list-row:last-child{border-bottom:none}
.list-row .w{font-weight:700;font-size:18px;cursor:pointer}
.list-row .py{color:var(--text-sub);font-size:14px;letter-spacing:1px}
.list-row .grow{flex:1;min-width:0}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:10px}
.badge{background:var(--bg);border-radius:12px;padding:12px 8px;text-align:center}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge .bi{font-size:26px}
.badge .bn{font-weight:700;font-size:14px}
.badge .bd{font-size:12px;color:var(--text-sub);line-height:1.5}
.report-box{background:var(--bg);border-radius:12px;padding:14px 16px;line-height:1.9;margin-top:10px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 0;border-bottom:1px dashed var(--line)}
.switch-row:last-child{border-bottom:none}
.switch{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;
  transition:background .2s;flex:none;min-width:52px;min-height:30px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--success)}
.switch.on::after{left:25px}
.ktag{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--info-light);color:var(--info);font-weight:600}
/* ============================================================
   弹层：Toast / Modal / 闪卡
   ============================================================ */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:#2E2A27;color:#FFF7EE;padding:10px 20px;border-radius:999px;opacity:0;
  pointer-events:none;transition:all .25s;z-index:200;font-size:15px;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-overlay{position:fixed;inset:0;background:rgba(30,25,20,.55);display:flex;
  align-items:center;justify-content:center;z-index:150;padding:16px}
.modal{background:var(--card);border-radius:var(--radius);max-width:460px;width:100%;
  padding:24px;animation:fadeUp .25s ease-out;max-height:86vh;overflow:auto}
.modal h3{font-size:20px;margin-bottom:10px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.ob-dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.ob-dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.ob-dot.on{background:var(--brand)}
.ob-ico{font-size:44px;text-align:center}

/* =====================================================================
 * 一、词库数据（必须内联：file:// 协议下 fetch 会被 CORS 拦截导致白屏）
 * 说明：为避免手抄出错，pinyin_plain / initials / id 由 W() 工厂从
 * 带调拼音统一推导，推导结果直接写入词条对象（比手抄更不易错）。
 * ===================================================================== */
function stripTones(s){
  return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}
const WORD_DB=[];
const __seenIds={};
function W(word,py,pos,grade,color,def,ex,syn,ant,tags,confuse,contrast){
  const syl=py.trim().split(/\s+/);
  const plain=syl.map(stripTones).join("");
  const split=t=>{const i=String(t).indexOf("|");
    return i<0?{word:t,diff:""}:{word:String(t).slice(0,i),diff:String(t).slice(i+1)};};
  /* 同音不同词（如"形式/形势"）共享全拼，id 加序号防碰撞 */
  let id=plain;

/* 主题标签固定表（避免标签爆炸，词条 tags 只能从这里取；
   在策划案 18 个标签基础上补充“时间”，供开始/结束/继续等词使用） */
const TAG_LIST=["情绪","心情","动作","神态","声音","天气","自然","景物","人物","性格","品质","学习","生活","程度","速度","数量","颜色","空间","时间"];

/* =====================================================================
 * 三、数据访问 API（纯逻辑，无 DOM，可在 Node 里单独测试）
 * ===================================================================== */
const POS_LIST=["名词","动词","形容词","副词","量词","成语"];
const DB_API=(()=>{
  const byIdMap={},byWordMap={};
  WORD_DB.forEach(e=>{byIdMap[e.id]=e;byWordMap[e.word]=e;});
  const relatedCache=new Map();

  /* 该词引用到的全部相关词（自身 + 近义词 + 反义词），用于 R2/R8 校验 */
  function relatedSet(e){
    let s=relatedCache.get(e.id);
    if(!s){
      s=new Set([e.word]);
      e.synonyms.forEach(x=>s.add(x.word));
      e.antonyms.forEach(x=>s.add(x.word));
      relatedCache.set(e.id,s);
    }
    return s;
  }
  /* R8 相关性判定：互为近/反义，或共享近义词，即视为相关 */
  function isRelated(a,b){
    if(!a||!b)return false;
    if(a.id===b.id)return true;
    if(relatedSet(a).has(b.word)||relatedSet(b).has(a.word))return true;
    for(const x of a.synonyms){if(b.synonyms.some(y=>y.word===x.word))return true;}
    return false;
  }

  /* ---------- 检索（P2：汉字 / 拼音全拼 / 拼音首字母） ---------- */
  function cleanQuery(q){
    return String(q==null?"":q)
      .replace(/^[，。！？、；：,.!?~\s]+|[，。！？、；：,.!?~\s]+$/g,"").trim();
  }
  function search(raw){
    const q=cleanQuery(raw);
    if(!q)return[];
    const low=q.toLowerCase();
    const qPlain=stripTones(low).replace(/[\s']/g,"");
    const out=[];
    for(const e of WORD_DB){
      let score=-1,field="",start=0,len=0;
      if(e.word===q){score=100;field="word";start=0;len=q.length;}
      else if(qPlain&&e.pinyin_plain===qPlain){score=95;field="plain";start=0;len=qPlain.length;}
      else if(low.length>=2&&e.initials===low){score=90;field="initials";start=0;len=low.length;}
      else if(e.word.startsWith(q)){score=80;field="word";start=0;len=q.length;}
      else if(qPlain.length>=2&&e.pinyin_plain.startsWith(qPlain)){score=70;field="plain";start=0;len=qPlain.length;}
      else if(qPlain.length>=2&&e.initials.startsWith(qPlain)){score=60;field="initials";start=0;len=qPlain.length;}
      else if(qPlain.length>=2&&e.pinyin_plain.includes(qPlain)){score=55;field="plain";start=e.pinyin_plain.indexOf(qPlain);len=qPlain.length;}
      else if(q.length>=2&&e.word.includes(q)){score=50;field="word";start=e.word.indexOf(q);len=q.length;}
      else if(e.tags.indexOf(q)>=0){score=45;field="tag";}
      if(score>0)out.push({e:e,score:score,field:field,start:start,len:len});
    }
    out.sort((a,b)=>b.score-a.score||a.e.word.length-b.e.word.length||a.e.id.localeCompare(b.e.id));
    return out;
  }
  /* 把"无声调全拼"里的匹配区间映射回带调拼音，用于高亮 */
  function plainRangeToPinyin(e,start,len){
    const syls=e.pinyin.split(/\s+/);
    let pos=0;const spans=[];
    for(let i=0;i<syls.length;i++){
      const p=stripTones(syls[i]);
      const s0=pos,s1=pos+p.length;
      const ov0=Math.max(s0,start),ov1=Math.min(s1,start+len);
      if(ov1>ov0)spans.push({i:i,a:ov0-s0,b:ov1-s0});
      pos=s1;
    }
    return spans;
  }
  function byId(id){return byIdMap[id]||null;}
  function byWord(w){return byWordMap[w]||null;}
  function letters(){
    const set={};
    WORD_DB.forEach(e=>{const c=(e.pinyin_plain[0]||"").toUpperCase();if(c)set[c]=1;});
    return Object.keys(set).sort();
  }
  function byLetter(ch){return WORD_DB.filter(e=>(e.pinyin_plain[0]||"").toUpperCase()===ch);}
  function byTag(t){return WORD_DB.filter(e=>e.tags.indexOf(t)>=0);}
  /* 每日一词：按日期确定性取词 */
  function daily(){
    const d=new Date();
    const key=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
    return WORD_DB[key%WORD_DB.length];
  }
  function recommend(n){
    const d=new Date();
    const seed=d.getFullYear()+d.getMonth()*31+d.getDate()*7;
    const arr=[];
    for(let i=0;i<WORD_DB.length;i++)arr.push(WORD_DB[(seed+i*97)%WORD_DB.length]);
    return arr.filter((e,i,a)=>a.indexOf(e)===i).slice(0,n);
  }
  return {byId:byId,byWord:byWord,search:search,cleanQuery:cleanQuery,
    isRelated:isRelated,relatedSet:relatedSet,plainRangeToPinyin:plainRangeToPinyin,
    letters:letters,byLetter:byLetter,byTag:byTag,daily:daily,recommend:recommend};
})();

/* =====================================================================
 * 四、本地存储（P5：统一前缀 syn.，容错读取，配额兜底）
 * ===================================================================== */
const STORE=(()=>{
  const P="syn.",VERSION="1.0";
  function safeParse(v,def){try{const o=JSON.parse(v);return o==null?def:o;}catch(e){return def;}}
  function load(key,def){
    try{const raw=localStorage.getItem(P+key);if(raw==null)return def;return safeParse(raw,def);}
    catch(e){return def;}   // 隐私模式/被禁用时抛异常，兜底默认值
  }
  function pruneHistory(h){
    const keep={};
    const d=new Date();
    for(let i=0;i<90;i++){          // 只保留最近 90 天
      const t=new Date(d.getTime()-i*86400000);
      keep[t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")]=1;
    }
    Object.keys(h).forEach(k=>{if(!keep[k])delete h[k];});
  }
  function save(key,val){
    try{localStorage.setItem(P+key,JSON.stringify(val));return true;}
    catch(e){                     // 配额满：清掉最占空间的历史再试一次
      try{localStorage.removeItem(P+"history");localStorage.setItem(P+key,JSON.stringify(val));return true;}
      catch(e2){return false;}
    }
  }
  function remove(key){try{localStorage.removeItem(P+key);}catch(e){}}
  function migrate(){/* v1.0 为首个版本，预留升级迁移入口 */}
  function init(){
    let v="0";
    try{const raw=localStorage.getItem(P+"version");v=raw==null?"0":safeParse(raw,"0");}catch(e){}
    if(v!==VERSION){migrate();save("version",VERSION);}
    if(!Array.isArray(load("favorites",null)))save("favorites",[]);
    const w=load("wrong",null);if(!w||typeof w!=="object"||Array.isArray(w))save("wrong",{});
    const h=load("history",null);if(!h||typeof h!=="object"||Array.isArray(h))save("history",{});
    const s=load("streak",null);if(!s||typeof s!=="object"||Array.isArray(s))save("streak",{current:0,longest:0,lastDate:""});
    if(!Array.isArray(load("badges",null)))save("badges",[]);
    const st=load("settings",null);if(!st||typeof st!=="object"||Array.isArray(st))save("settings",{sound:true,theme:"light",level:1});
    const t=load("totals",null);if(!t||typeof t!=="object"||Array.isArray(t))save("totals",{});
    if(!Array.isArray(load("recent",null)))save("recent",[]);
    const m=load("mastered",null);if(!m||typeof m!=="object"||Array.isArray(m))save("mastered",{});
  }
  return {load:load,save:save,remove:remove,init:init,VERSION:VERSION};
})();

  it.count++;it.streak=0;it.lastWrongAt=Date.now();

/* 对错题本里的词答对：连续答对 2 次自动出库（真闭环），返回是否出库 */
function recordRightOnWrong(id){
  const w=getWrong(),it=w[id];
  if(!it)return false;
  it.streak=(it.streak||0)+1;
  if(it.streak>=2){
    delete w[id];
    STORE.save("wrong",w);   // 出库必须写回，否则刷新后错题"复活"
    const m=STORE.load("mastered",{});m[id]=Date.now();STORE.save("mastered",m);

  for(let i=0;i<7;i++){
    const day=h[todayStr(new Date(Date.now()-i*86400000))];

  }

/* 薄弱词：错误次数 ≥2 且尚未出库 */
function weakWords(minCount){
  const w=getWrong(),arr=[];
  for(const id in w){
    if(w[id].count>=(minCount||2)){
      const e=DB_API.byId(id);
      if(e)arr.push({entry:e,count:w[id].count,lastWrongAt:w[id].lastWrongAt,types:w[id].wrongTypes});
    }
  }
  arr.sort((a,b)=>b.count-a.count||b.lastWrongAt-a.lastWrongAt);
  return arr;
}
function relTime(ts){
  if(!ts)return"";
  const days=Math.floor((Date.now()-ts)/86400000);
  if(days<=0)return"今天";
  if(days===1)return"昨天";
  return days+" 天前";
}
const KIND_NAME={syn:"近义",ant:"反义",odd:"异类",swap:"替换",fillSyn:"近义填写",fillAnt:"反义填写",learn:"自动学习"};

/* =====================================================================
 * 五、出题引擎（P4：题目 = 词库 × 题型模板实时生成，R1-R8 硬性规则）
 *
 * 规则落地说明：
 * R1 正确答案必须来自该词的 synonyms（近义题）或 antonyms（反义题）。
 * R2 原文"干扰项不能是该词任何正确的近义词或反义词"按其本意（防止双正确
 *    答案）落地为：除正确答案外，任何选项不得属于该词的同类答案集合
 *    （近义题=其余近义词；反义题=其余反义词）。反义题用近义词作干扰项、
 *    近义题用反义词作干扰项，是 R3/R4 明确要求的测混淆点，予以保留。
 * R3 近义题干扰项优先取该词的 antonyms，其次同词性无关词。
 * R4 反义题干扰项优先取该词的 synonyms（最高频错因）。
 * R5 四个选项同词性。
 * R6 四个选项字数差 ≤2。
 * R7 同一关 5 题内不重复考同一个词。
 * R8 生成后全量校验：选项两两之间不能互为近义/反义（isRelated）。
 *    校验不过就重新生成，10 次失败换题换词，绝不放行不合格题目。
 * ===================================================================== */
const QUIZ_ENGINE=(()=>{
  function shuffle(arr){           // Fisher-Yates 洗牌
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}
    return a;
  }
  function pickOne(arr){return arr[Math.floor(Math.random()*arr.length)];}
  function stemPool(level){        // F17：按年级筛选词库
    if(level===1)return WORD_DB.filter(e=>e.grade<=4);
    if(level===2)return WORD_DB.filter(e=>e.grade>=4&&e.grade<=6);
    return WORD_DB.filter(e=>e.grade>=5);
  }
  /* R6：字数差 ≤2 */
  function lenOk(words){
    let mn=99,mx=0;
    words.forEach(w=>{const n=w.length;mn=Math.min(mn,n);mx=Math.max(mx,n);});
    return mx-mn<=2;
  }
  /* 干扰项挑选：优先池（近义题=反义词；反义题=近义词）+ 同词性无关词 */
  function buildDistractors(stem,kind,answerWord,answerPos){
    const exclude=new Set([stem.word,answerWord]);
    const answerSet=(kind==="syn"?stem.synonyms:stem.antonyms).map(x=>x.word);
    answerSet.forEach(w=>{if(w!==answerWord)exclude.add(w);});   // R2：杜绝双正确答案
    const prefer=(kind==="syn"?stem.antonyms:stem.synonyms).map(x=>x.word)
      .filter(w=>!exclude.has(w)&&Math.abs(w.length-answerWord.length)<=2)
      .filter(w=>{const en=DB_API.byWord(w);return !en||en.pos===answerPos;});  // R5
    const general=WORD_DB
      .filter(e=>e.pos===answerPos&&e.word!==stem.word&&!exclude.has(e.word)
        &&Math.abs(e.word.length-answerWord.length)<=2
        &&!DB_API.relatedSet(stem).has(e.word))
      .map(e=>e.word);
    const picked=[],pool=shuffle(prefer).concat(shuffle(general));
    for(const w of pool){
      if(picked.length>=3)break;
      if(picked.indexOf(w)>=0)continue;
      let clash=false;
      for(const p of picked){const a=DB_API.byWord(w),b=DB_API.byWord(p);
        if(a&&b&&DB_API.isRelated(a,b)){clash=true;break;}}
      if(!clash)picked.push(w);
    }
    return picked.length===3?picked:null;
  }
  /* 生成后校验：R2/R5/R6/R8，返回失败规则名或 null */
  function validateOptions(stem,kind,answerWord,options){
    const answerSet=(kind==="syn"?stem.synonyms:stem.antonyms).map(x=>x.word);
    for(const w of options){                       // R2
      if(w!==answerWord&&answerSet.indexOf(w)>=0)return"R2";
    }
    const posSet={};let unknown=false;             // R5
    for(const w of options){
      const en=DB_API.byWord(w);
      if(en)posSet[en.pos]=1;else unknown=true;
    }
    if(!unknown&&Object.keys(posSet).length>1)return"R5";
    if(!lenOk(options))return"R6";                 // R6
    for(let i=0;i<options.length;i++)              // R8
      for(let j=i+1;j<options.length;j++){
        const a=DB_API.byWord(options[i]),b=DB_API.byWord(options[j]);
        if(a&&b&&DB_API.isRelated(a,b))return"R8";
      }
    return null;
  }
  /* 近义题 */
  function genSyn(stem){
    if(!stem.synonyms.length)return null;
    const withEntry=stem.synonyms.filter(s=>DB_API.byWord(s.word));
    const chosen=pickOne(withEntry.length?withEntry:stem.synonyms);
    const ansEntry=DB_API.byWord(chosen.word);
    const pos=ansEntry?ansEntry.pos:stem.pos;
    for(let t=0;t<10;t++){
      const ds=buildDistractors(stem,"syn",chosen.word,pos);
      if(!ds)continue;
      const options=shuffle([chosen.word].concat(ds));
      if(validateOptions(stem,"syn",chosen.word,options))continue;
      return {kind:"syn",wordId:stem.id,word:stem.word,pinyin:stem.pinyin,
        prompt:"下面哪个词是「"+stem.word+"」的近义词？",
        options:options,answerIndex:options.indexOf(chosen.word),
        explain:"「"+stem.word+"」和「"+chosen.word+"」是近义词。"+chosen.diff};
    }
    return null;
  }
  /* 反义题 */
  function genAnt(stem){
    if(!stem.antonyms.length)return null;
    const withEntry=stem.antonyms.filter(s=>DB_API.byWord(s.word));
    const chosen=pickOne(withEntry.length?withEntry:stem.antonyms);
    const ansEntry=DB_API.byWord(chosen.word);
    const pos=ansEntry?ansEntry.pos:stem.pos;
    for(let t=0;t<10;t++){
      const ds=buildDistractors(stem,"ant",chosen.word,pos);
      if(!ds)continue;
      const options=shuffle([chosen.word].concat(ds));
      if(validateOptions(stem,"ant",chosen.word,options))continue;
      return {kind:"ant",wordId:stem.id,word:stem.word,pinyin:stem.pinyin,
        prompt:"下面哪个词和「"+stem.word+"」意思相反？",
        options:options,answerIndex:options.indexOf(chosen.word),
        explain:"「"+stem.word+"」和「"+chosen.word+"」意思相反。"+chosen.diff};
    }
    return null;
  }
  /* 找异类题：3 个互为近义词 + 1 个无关词（无关词不能与组内任何词近义/反义） */
  function genOdd(stem){
    const synEntries=stem.synonyms.map(s=>DB_API.byWord(s.word)).filter(Boolean);
    const uniq=[],seen={};
    for(const s of synEntries){if(!seen[s.word]&&s.pos===stem.pos){seen[s.word]=1;uniq.push(s);}}
    if(uniq.length<2)return null;
    for(let t=0;t<10;t++){
      const g2=shuffle(uniq).slice(0,2);
      const group=[stem,g2[0],g2[1]];
      let bad=false;
      for(let i=0;i<group.length;i++)for(let j=i+1;j<group.length;j++){
        if(group[i].antonyms.some(a=>a.word===group[j].word))bad=true;
      }
      if(bad)continue;
      const cands=WORD_DB.filter(e=>
        e.pos===stem.pos&&
        group.every(g=>g.id!==e.id)&&
        group.every(g=>!DB_API.isRelated(g,e))&&
        Math.abs(e.word.length-stem.word.length)<=2);
      if(!cands.length)continue;
      const odd=pickOne(cands);
      const options=shuffle(group.map(g=>g.word).concat([odd.word]));
      if(!lenOk(options))continue;
      return {kind:"odd",wordId:stem.id,word:stem.word,pinyin:stem.pinyin,
        prompt:"下面哪个词和其他三个不是一类？（从意思上看）",
        options:options,answerIndex:options.indexOf(odd.word),
        explain:"「"+group.map(g=>g.word).join("」「")+"」是一组近义词，意思相近；而「"+odd.word+"」的意思是“"+odd.definition+"”，和它们不是一类。"};
    }
    return null;
  }
  /* 句中替换判断题（F14）：依据辨析库的 swap 标注出题；R7：跳过本关已用的词 */
  function genSwap(poolIds,usedIds){
    const keys=Object.keys(CONTRAST_DB).filter(function(k){return CONTRAST_DB[k].swap!==undefined;});
    const usable=keys.filter(function(k){
      const ids=k.split("|").map(function(w){const e=DB_API.byWord(w);return e?e.id:null;});
      if(usedIds&&ids.some(function(id){return id&&usedIds[id];}))return false;
      if(!poolIds)return true;
      return ids.some(function(id){return id&&poolIds.indexOf(id)>=0;});
    });
    const pool=usable.length?usable:keys.filter(function(k){
      const ids=k.split("|").map(function(w){const e=DB_API.byWord(w);return e?e.id:null;});
      return !(usedIds&&ids.some(function(id){return id&&usedIds[id];}));
    });
    if(!pool.length)return null;
    for(let t=0;t<10;t++){
      const key=pickOne(pool),pair=CONTRAST_DB[key];
      let names=key.split("|");
      if(Math.random()<0.5)names=[names[1],names[0]];   // 随机方向
      const A=DB_API.byWord(names[0]),B=DB_API.byWord(names[1]);
      if(!A||!B)continue;
      const ex=A.examples.filter(s=>s.indexOf(A.word)>=0)[0];
      if(!ex)continue;
      return {kind:"swap",wordId:A.id,word:A.word,pinyin:A.pinyin,
        sentence:ex,fromWord:A.word,toWord:B.word,
        prompt:"把句中的「"+A.word+"」换成「"+B.word+"」，句子的意思变了吗？",
        options:["意思基本不变","意思变了"],
        answerIndex:pair.swap?0:1,
        explain:pair.pitfall||(pair.scene&&pair.scene.why)||("「"+A.word+"」和「"+B.word+"」在这句话里不能随便互换。")};
    }
    return null;
  }
  /* 填写题：给出词语，用户手输近/反义词（判分见 checkFillAnswer） */
  function genFill(kind,stem){
    const list=kind==="fillSyn"?stem.synonyms:stem.antonyms;
    if(!list.length)return null;
    return {kind:kind,wordId:stem.id,word:stem.word,pinyin:stem.pinyin,
      prompt:kind==="fillSyn"
        ?("请写出一个「"+stem.word+"」的近义词")
        :("请写出一个「"+stem.word+"」的反义词"),
      answers:list.map(x=>x.word),
      explain:"「"+stem.word+"」的"+(kind==="fillSyn"?"近义词":"反义词")+"："
        +list.map(x=>x.word).join("、")+"。"+list[0].diff};
  }
  /* 填写判分：词库正向匹配；也接受"反向互认"（填的词的近/反义表里有题干词）。
     state: empty 没填 / self 填了题干本身 / ok 答对 / no 没对上 */
  function checkFillAnswer(stem,kind,input){
    const q=String(input==null?"":input).replace(/\s+/g,"");
    if(!q)return {state:"empty"};
    if(q===stem.word)return {state:"self"};
    const list=(kind==="fillSyn"?stem.synonyms:stem.antonyms);
    for(let i=0;i<list.length;i++){
      if(list[i].word===q)return {state:"ok",matched:q,reverse:false};
    }
    const en=DB_API.byWord(q);
    if(en){
      const refs=kind==="fillSyn"?en.synonyms:en.antonyms;
      for(let i=0;i<refs.length;i++){
        if(refs[i].word===stem.word)return {state:"ok",matched:q,reverse:true};
      }
    }
    return {state:"no"};
  }
  /* 自动学习卡：一词展示释义 + 全部近/反义词（不判分、不计入统计） */
  function genLearn(stem){
    if(!stem.synonyms.length&&!stem.antonyms.length)return null;
    return {kind:"learn",wordId:stem.id,word:stem.word,pinyin:stem.pinyin,
      definition:stem.definition,
      synWords:stem.synonyms.map(x=>x.word),
      antWords:stem.antonyms.map(x=>x.word),
      explain:stem.confuse||""};
  }
  function gen(kind,entry,poolIds,usedIds){
    if(kind==="syn")return genSyn(entry);
    if(kind==="ant")return genAnt(entry);
    if(kind==="odd")return genOdd(entry);
    if(kind==="swap")return genSwap(poolIds||null,usedIds||null);
    if(kind==="fillSyn"||kind==="fillAnt")return genFill(kind,entry);
    if(kind==="learn")return genLearn(entry);
    return null;
  }
  function eligible(kind,e){
    if(kind==="syn"||kind==="fillSyn")return e.synonyms.length>0;
    if(kind==="ant"||kind==="fillAnt")return e.antonyms.length>0;
    if(kind==="odd")return e.synonyms.filter(s=>DB_API.byWord(s.word)&&DB_API.byWord(s.word).pos===e.pos).length>=2;
    if(kind==="learn")return e.synonyms.length>0||e.antonyms.length>0;
    return true;
  }
  /* 生成一关（5 题 / 错题特训 / 单词特训），R7：关内词不重复 */
  function generateLevel(opts){
    opts=opts||{};
    const level=opts.level||1;
    let pool;
    if(opts.mode==="wrong"){
      const w=getWrong();
      pool=Object.keys(w).map(DB_API.byId).filter(Boolean).sort((a,b)=>w[b.id].count-w[a.id].count);
    }else if(opts.mode==="focus"||opts.mode==="focusFill"){
      pool=[DB_API.byId(opts.focusId)].filter(Boolean);
    }else{
      pool=stemPool(level);
    }
    /* 关卡题量可设置（F08 扩展）：focus 类固定 3 题，其余按 count（默认 5） */
    const want=opts.count||(opts.mode==="focus"||opts.mode==="focusFill"?3:5);
    let kinds;
    if(opts.mode==="fill"){
      kinds=[];for(let i=0;i<want;i++)kinds.push(i%2?"fillAnt":"fillSyn");
      shuffle(kinds);
    }else if(opts.mode==="auto"){
      kinds=[];for(let i=0;i<want;i++)kinds.push("learn");
    }else if(opts.mode==="focusFill"){
      kinds=["fillSyn","fillAnt","fillSyn"];
    }else{
      const base=["syn","syn","ant","ant","odd","swap"];
      kinds=[];while(kinds.length<want)kinds.push(...base);
      kinds=shuffle(kinds.slice(0,want));
    }
    const questions=[],used={};
    function tryKind(k){
      if(questions.length>=want)return;
      if(k==="swap"){
        const q=gen("swap",null,opts.mode?null:pool.map(x=>x.id),used);
        if(q){used[q.wordId]=1;questions.push(q);}
        return;
      }
      const order=shuffle(pool.filter(e=>!used[e.id]&&eligible(k,e)));
      for(const e of order){
        const q=gen(k,e,opts.mode?null:pool.map(x=>x.id),used);
        if(q){used[e.id]=1;questions.push(q);return;}
      }
    }
    kinds.forEach(tryKind);
    ["syn","ant","odd"].forEach(tryKind);   // 题型受限时兜底补足
    return questions;
  }
  /* 开发者自检（P4）：全词库 × 全题型生成并逐题校验，用 console.warn 打印不合格题
     注意：找异类题不用通用 R8（组内 3 词互为近义是题型定义），
     改查"无关词不能与组内任何词构成近义/反义/共享近义关系"。 */
  function selfTestQuiz(n){
    let genCount=0,fail=0;const log=[];
    WORD_DB.forEach(function(e){
      ["syn","ant","odd","fillSyn","fillAnt","learn"].forEach(function(kind){
        const q=gen(kind,e,null);
        if(!q)return;
        genCount++;
        let err;
        if(kind==="odd"){
          const odd=q.options[q.answerIndex];
          err=null;
          q.options.forEach(function(w){
            if(w===odd)return;
            const a=DB_API.byWord(w),b=DB_API.byWord(odd);
            if(a&&b&&DB_API.isRelated(a,b))err="R8-odd(无关词与组内相关)";
          });
        }else if(kind==="fillSyn"||kind==="fillAnt"){
          if(!q.answers.length||q.answers.indexOf(q.word)>=0)
            err="fill(参考答案为空或含题干)";
          else if(checkFillAnswer(e,kind,q.answers[0]).state!=="ok")
            err="fill(参考答案无法判分)";
        }else if(kind==="learn"){
          if((!q.synWords.length&&!q.antWords.length)
            ||q.synWords.indexOf(q.word)>=0||q.antWords.indexOf(q.word)>=0)
            err="learn(卡片内容为空或含题干)";
        }else{
          err=validateOptions(e,kind,q.options[q.answerIndex],q.options);
        }
        if(err){fail++;log.push(e.word+" ["+kind+"] "+err+"： "
          +(q.options?q.options.join(" / "):(q.answers||q.synWords||[]).join("、")));}
      });
    });
    let full=0,dup=0;
    for(let i=0;i<(n||60);i++){
      const qs=generateLevel({level:(i%3)+1,mode:"normal"});
      if(qs.length===5)full++;
      if(new Set(qs.map(q=>q.wordId)).size!==qs.length)dup++;
    }
    log.forEach(function(l){console.warn("[selfTest] 不合格题目:",l);});
    return {total:genCount,failed:fail,failures:log,levelsFull:full,levelsDup:dup};
  }
  return {shuffle:shuffle,stemPool:stemPool,gen:gen,eligible:eligible,
    validateOptions:validateOptions,checkFillAnswer:checkFillAnswer,
    generateLevel:generateLevel,selfTestQuiz:selfTestQuiz};
})();

/* ---------- 音效（WebAudio 合成，无音频文件、无网络） ---------- */
let actx=null;
function tone(freq,dur,type,gain){
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume().catch(function(){});
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||"sine";o.frequency.value=freq;
    o.connect(g);g.connect(actx.destination);
    const t=actx.currentTime;
    g.gain.setValueAtTime(gain||0.04,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}

function markIn(parent,text,start,len){
  if(start==null||start<0||len<=0||start+len>text.length){parent.textContent=text;return;}
  parent.appendChild(document.createTextNode(text.slice(0,start)));
  const m=el("mark",null,text.slice(start,start+len));
  parent.appendChild(m);
  parent.appendChild(document.createTextNode(text.slice(start+len)));
}
function highlightPinyin(parent,e,start,len){
  const spans=DB_API.plainRangeToPinyin(e,start,len);
  if(!spans.length){parent.textContent=e.pinyin;return;}
  const syls=e.pinyin.split(/\s+/);
  syls.forEach(function(syl,i){
    if(i>0)parent.appendChild(document.createTextNode(" "));
    const sp=spans.filter(function(x){return x.i===i;})[0];
    if(sp&&sp.a===0&&sp.b===syl.length)parent.appendChild(el("mark",null,syl));
    else if(sp){markIn(parent,syl,sp.a,sp.b-sp.a);}
    else parent.appendChild(document.createTextNode(syl));
  });
}

/* =====================================================================
 * 辨析视图（P3 精修：五维对比 + 同场景例句 + 交换 A/B）
 * ===================================================================== */
function contrastPairKey(a,b){
  return CONTRAST_DB[a.word+"|"+b.word]?a.word+"|"+b.word
    :(CONTRAST_DB[b.word+"|"+a.word]?b.word+"|"+a.word:null);
}
function buildContrast(a,b){
  const key=contrastPairKey(a,b);
  const pair=key?CONTRAST_DB[key]:null;
  const dims={weight:null,scope:null,color:null,coll:null,pos:null};
  if(a.color!==b.color)dims.color=["「"+a.word+"」是"+a.color+"词","「"+b.word+"」是"+b.color+"词"];
  if(a.pos!==b.pos)dims.pos=["「"+a.word+"」是"+a.pos,"「"+b.word+"」是"+b.pos];
  if(pair){
    for(const k in pair.rows)dims[k]=pair.rows[k];
  }else{
    /* 数据不足时从 diff 文本推导（诚实标注，不编造） */
    const diffOf=function(stem,other){
      const s=stem.synonyms.filter(function(x){return x.word===other.word;})[0];
      return s?s.diff:"";
    };
    const ta=diffOf(a,b),tb=diffOf(b,a);
    if(/更(重|深|强|大|高)|最重|轻一?些|程度/.test(ta)||/更(重|深|强|大|高)|最重|轻一?些|程度/.test(tb))
      dims.weight=[ta?shortDiff(ta):"—",tb?shortDiff(tb):"—"];
    if(/多(形容|指|用于|说)|一般(说|指)|场合|范围|书面|口语/.test(ta)||/多(形容|指|用于|说)|一般(说|指)|场合|范围|书面|口语/.test(tb))
      dims.scope=[ta?shortDiff(ta):"—",tb?shortDiff(tb):"—"];
    if(/搭配|常说|可以说|固定|连用/.test(ta)||/搭配|常说|可以说|固定|连用/.test(tb))
      dims.coll=[ta?shortDiff(ta):"—",tb?shortDiff(tb):"—"];
  }
  return {a:a,b:b,dims:dims,scene:pair?pair.scene:null,
    pitfall:pair?pair.pitfall:(a.confuse||b.confuse||""),curated:!!pair,swap:pair?pair.swap:undefined};
}

  input.setAttribute("aria-label","选择 "+label+" 词");
  const e=get();
  if(e)input.value=e.word;
  const list=el("div","picker-list");
  list.style.display="none";
  function refresh(){

function renderContrastResult(ct){

  if(!present.length){
    const b=el("div","same-banner");
    b.textContent="这两个词基本可以互换，只有细微的语感差别。";

    const tips=el("div","scene-box");
    tips.appendChild(el("div","scene-ctx","各自要点"));
    [ct.a,ct.b].forEach(function(e){
      e.synonyms.forEach(function(s){
        if(s.word===(e===ct.a?ct.b.word:ct.a.word)&&s.diff)
          tips.appendChild(el("div","scene-line","· "+s.diff));
      });
    });
    card.appendChild(tips);
  }else{
    const t=el("table","ct-table");
    const thead=el("thead"),trh=el("tr");
    ["维度",ct.a.word,ct.b.word].forEach(function(h,i){
      trh.appendChild(el(i===0?"th":"th",null,h));
    });

    const tbody=el("tbody");
    present.forEach(function(r){

      tr.appendChild(el("th",null,r[1]));
      tr.appendChild(el("td",null,ct.dims[r[0]][0]));
      tr.appendChild(el("td",null,ct.dims[r[0]][1]));
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);card.appendChild(t);
    if(!ct.curated)card.appendChild(el("div","muted","以上差异由词库标注推导；其余维度差异不明显或数据还不完整。"));
  }
  if(ct.scene){

    const l1=el("div","scene-line");l1.appendChild(el("span","ex-num","①"));
    markIn(l1,ct.scene.a,ct.scene.a.indexOf(ct.a.word),ct.a.word.length);
    box.appendChild(l1);
    const l2=el("div","scene-line");l2.appendChild(el("span","ex-num","②"));
    markIn(l2,ct.scene.b,ct.scene.b.indexOf(ct.b.word),ct.b.word.length);
    box.appendChild(l2);
    const con=el("div","scene-conclusion");
    con.textContent=(ct.scene.better?("这个场景更适合用「"+ct.scene.better+"」，因为"):"为什么")+ct.scene.why;
    box.appendChild(con);
    card.appendChild(box);
  }else{
    const box=el("div","scene-box");
    box.appendChild(el("div","scene-ctx","例句对照（词库里还没有为这对词写同场景例句）："));
    [ct.a,ct.b].forEach(function(e,i){

      const line=el("div","scene-line");
      line.appendChild(el("span","ex-num",i===0?"①":"②"));

    box.appendChild(el("span",null,ct.pitfall));
    card.appendChild(box);
  }
  return card;
}

/* 填写题判分：支持"看答案"（记入错题本，之后接着练） */
function judgeFill(peeked){
  const qz=S.quiz;
  if(!qz||qz.locked||qz.stage!=="playing")return;
  const q=qz.questions[qz.index];
  let res;
  if(peeked){
    res={state:"peek"};
  }else{
    const entry=DB_API.byId(q.wordId);   /* checkFillAnswer 需要词条对象 */
    res=QUIZ_ENGINE.checkFillAnswer(entry,q.kind,qz.nodes.fillInput.value);
    if(res.state==="empty"){toast("先写一个词再提交哦");return;}
    if(res.state==="self"){
      const fb0=qz.nodes.fb;fb0.textContent="";
      const hint=el("div","fb fb-no");
      hint.appendChild(el("div","fb-title","「"+q.word+"」就是题目本身，换一个意思相近或相反的词试试。"));
      fb0.appendChild(hint);
      return;
    }
  }
  qz.locked=true;
  qz.nodes.fillInput.disabled=true;
  qz.nodes.fillSubmit.disabled=true;
  qz.nodes.fillPeek.disabled=true;
  const prog=document.querySelector("#view-quiz .qprog-fill");
  if(prog)prog.style.width=((qz.index+1)/qz.questions.length*100)+"%";
  const fb=qz.nodes.fb;
  fb.textContent="";
  let mastered=false;
  if(res.state==="ok"){
    qz.combo++;qz.maxCombo=Math.max(qz.maxCombo,qz.combo);qz.correct++;
    bumpTotals({answered:1,correct:1});bumpHistory("answered");bumpHistory("correct");
    mastered=recordRightOnWrong(q.wordId);
    const box=el("div","fb fb-ok");
    box.appendChild(el("div","fb-title","答对了！🎉"+(qz.combo>=2?("（连对 "+qz.combo+" 题）"):"")));
    box.appendChild(el("div","fb-body",q.explain));
    fb.appendChild(box);
    playCorrect();
    if(mastered){
      playMaster();
      toast("🎉 「"+q.word+"」连续答对 2 次，已从错题本出库！");
      bumpTotals({mastered:1});
    }
  }else{
    qz.combo=0;
    bumpTotals({answered:1});bumpHistory("answered");
    recordWrong(q.wordId,q.kind);
    qz.wrongList.push({word:q.word,answer:q.answers[0],explain:q.explain});
    const box=el("div","fb fb-no");
    box.appendChild(el("div","fb-title",peeked?"没关系，先记住它们：":"再看看参考答案："));
    box.appendChild(el("div","fb-body",q.explain));
    fb.appendChild(box);
    if(!peeked)playWrong();
  }
  updateStreak();
  checkBadges().forEach(function(b){toast(b.icon+" 解锁徽章： "+b.name);});
  qz.nodes.nb.style.display="inline-flex";
  qz.timer=setTimeout(function(){
    if(S.quiz&&S.quiz.stage==="playing"&&S.quiz.mode!=="auto")nextQuestion();
  },res.state==="ok"?1200:2500);
}
function judge(i){
  const qz=S.quiz;
  if(!qz||qz.locked||qz.stage!=="playing")return;
  qz.locked=true;
  const q=qz.questions[qz.index];
  const ok=i===q.answerIndex;
  const btns=qz.nodes.grid.querySelectorAll(".opt");
  btns.forEach(function(b,j){
    b.disabled=true;
    if(j===q.answerIndex){
      b.classList.add(j===i?"ok":"reveal");
      if(j!==i)b.appendChild(el("span","ansmark","✓ 正确答案"));
    }else if(j===i){
      b.classList.add("bad");
    }else{
      b.classList.add("dim");
    }
  });
  qz.nodes.fill.style.width=((qz.index+1)/qz.questions.length*100)+"%";
  const fb=qz.nodes.fb;
  fb.textContent="";
  let mastered=false;
  if(ok){
    qz.combo++;qz.maxCombo=Math.max(qz.maxCombo,qz.combo);qz.correct++;
    bumpTotals({answered:1,correct:1});bumpHistory("answered");bumpHistory("correct");
    mastered=recordRightOnWrong(q.wordId);
    const box=el("div","fb fb-ok");
    box.appendChild(el("div","fb-title","答对了！🎉"+(qz.combo>=2?("（连对 "+qz.combo+" 题）"):"")));
    box.appendChild(el("div","fb-body",q.explain));
    fb.appendChild(box);
    playCorrect();
    if(mastered){
      playMaster();
      toast("🎉 「"+q.word+"」连续答对 2 次，已从错题本出库！");
      bumpTotals({mastered:1});
    }
  }else{
    qz.combo=0;
    bumpTotals({answered:1});bumpHistory("answered");
    recordWrong(q.wordId,q.kind);
    qz.wrongList.push({word:q.word,answer:q.options[q.answerIndex],explain:q.explain});
    const box=el("div","fb fb-no");
    box.appendChild(el("div","fb-title","这一次没答对，看看正确的词："));
    box.appendChild(el("div","fb-body",q.explain));
    fb.appendChild(box);
    playWrong();
  }
  updateStreak();
  checkBadges().forEach(function(b){toast(b.icon+" 解锁徽章： "+b.name);});
  qz.nodes.nb.style.display="inline-flex";
  qz.timer=setTimeout(function(){
    if(S.quiz&&S.quiz.stage==="playing")nextQuestion();
  },ok?1200:2500);
}
function nextQuestion(){
  const qz=S.quiz;
  clearTimeout(qz.timer);
  qz.index++;qz.locked=false;
  if(qz.index>=qz.questions.length){
    qz.stage="settle";
    bumpTotals({levels:1});
    const stars=starCount(qz.correct,qz.questions.length);
    if(stars===3)bumpTotals({stars3:1});
    setTotalsMax("maxCombo",qz.maxCombo);
    checkBadges().forEach(function(b){toast(b.icon+" 解锁徽章： "+b.name);});
  }
  renderQuiz();
}
function starCount(c,total){   /* 星级按正确率：全对3星、≥80%两星、≥60%一星 */
  const r=c/total;
  return r>=1?3:r>=0.8?2:r>=0.6?1:0;
}

  const prev=el("button","btn btn-plain btn-small","‹ 上一个");
  const pause=el("button","btn btn-ghost btn-small",qz.paused?"▶ 继续":"⏸ 暂停");
  const next=el("button","btn btn-primary btn-small","下一个 ›");
  prev.type="button";pause.type="button";next.type="button";
  prev.addEventListener("click",function(){
    clearTimeout(qz.timer);clearTimeout(qz.timer2);
    qz.index=(qz.index-1+qz.questions.length)%qz.questions.length;
    qz.revealed=true;qz.paused=true;renderQuiz();
  });
  next.addEventListener("click",function(){
    clearTimeout(qz.timer);clearTimeout(qz.timer2);
    autoAdvance();
  });
  pause.addEventListener("click",function(){
    if(qz.paused){                    /* 继续：未揭示先揭示，已揭示定时前进 */
      qz.paused=false;
      if(!qz.revealed){
        qz.timer=setTimeout(function(){revealAuto();},500);
      }
      qz.timer2=setTimeout(function(){autoAdvance();},qz.revealed?1800:2300);
    }else{
      qz.paused=true;
      clearTimeout(qz.timer);clearTimeout(qz.timer2);
    }
    renderQuiz();
  });
  ctrl.append(prev,pause,next);
  card.appendChild(ctrl);
  function revealAuto(){
    qz.revealed=true;
    const a=document.querySelector("#view-quiz .auto-answer");
    if(a)a.classList.add("revealed");
  }
  function autoAdvance(){
    const cur=S.quiz;
    if(!cur||cur.stage!=="playing"||cur.mode!=="auto")return;
    cur.index++;
    cur.revealed=false;
    if(cur.index>=cur.questions.length){cur.stage="settle";}
    renderQuiz();
  }
  if(!qz.paused){
    if(!qz.revealed)qz.timer=setTimeout(revealAuto,1400);
    qz.timer2=setTimeout(autoAdvance,qz.revealed?1800:4600);
  }
  return card;
}

function renderBrowse(){
  const v=$("#body-browse");v.textContent="";

  wrap.appendChild(el("div","view-title","📚 词库（"+WORD_DB.length+" 条）"));
  const filters=el("div","filter-row");
  const selPos=el("select");
  selPos.setAttribute("aria-label","按词性筛选");
  [["","全部词性"]].concat(POS_LIST.map(function(p){return [p,p];})).forEach(function(o){
    const op=el("option",null,o[1]);op.value=o[0];selPos.appendChild(op);
  });
  selPos.value=S.browse.pos;
  const selGrade=el("select");
  selGrade.setAttribute("aria-label","按年级筛选");
  [["","全部年级"],["1","1-2 年级"],["2","3-4 年级"],["3","5-6 年级"],["4","7-9 年级"]].forEach(function(o){
    const op=el("option",null,o[1]);op.value=o[0];selGrade.appendChild(op);
  });
  selGrade.value=S.browse.grade;
  const selTag=el("select");
  selTag.setAttribute("aria-label","按主题筛选");
  [["","全部主题"]].concat(TAG_LIST.map(function(t){return [t,t];})).forEach(function(o){
    const op=el("option",null,o[1]);op.value=o[0];selTag.appendChild(op);
  });
  selTag.value=S.browse.tag;
  const count=el("span","muted");
  filters.append(selPos,selGrade,selTag,count);
  wrap.appendChild(filters);
  const layout=el("div","browse-layout");
  const list=el("div","card");list.style.padding="8px 16px";
  const nav=el("div","letter-nav");
  layout.append(list,nav);
  wrap.appendChild(layout);
  function inGrade(e,band){
    if(!band)return true;
    if(band==="1")return e.grade<=2;
    if(band==="2")return e.grade>=3&&e.grade<=4;
    if(band==="3")return e.grade>=5&&e.grade<=6;
    return e.grade>=7;
  }
  function apply(){
    list.textContent="";nav.textContent="";
    const filtered=WORD_DB.filter(function(e){
      return (!S.browse.pos||e.pos===S.browse.pos)
        &&inGrade(e,S.browse.grade)
        &&(!S.browse.tag||e.tags.indexOf(S.browse.tag)>=0);
    });
    count.textContent="共 "+filtered.length+" 个词";
    if(!filtered.length){
      list.appendChild(el("div","empty","这个筛选组合下还没有词，换个条件试试。"));
      return;
    }
    const groups={};
    filtered.forEach(function(e){
      const c=(e.pinyin_plain[0]||"#").toUpperCase();
      (groups[c]=groups[c]||[]).push(e);
    });
    const letters=Object.keys(groups).sort();
    letters.forEach(function(ch){
      const head=el("div","letter-head",ch);
      head.id="lg-"+ch;
      list.appendChild(head);
      groups[ch].forEach(function(e){
        const row=el("button","wrow");
        row.type="button";
        row.appendChild(el("span","w",e.word));
        row.appendChild(el("span","py",e.pinyin));
        row.appendChild(el("span","def",e.definition));
        row.addEventListener("click",function(){
          S.entry=e;S.navStack=[];
          $("#search-input").value=e.word;
          goView("search");
        });
        list.appendChild(row);
      });
      const nb=el("button",null,ch);
      nb.type="button";
      nb.addEventListener("click",function(){
        const t=$("#lg-"+ch);if(t)t.scrollIntoView({block:"start"});
      });
      nav.appendChild(nb);
    });
  }
  selPos.addEventListener("change",function(){S.browse.pos=selPos.value;apply();});
  selGrade.addEventListener("change",function(){S.browse.grade=selGrade.value;apply();});
  selTag.addEventListener("change",function(){S.browse.tag=selTag.value;apply();});
  apply();
  v.appendChild(wrap);
}

function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);
}

/* ---------- 闪卡复习（P5 生词本） ---------- */
function openFlashcards(entries){
  let idx=0;
  const c=el("div");
  const head=el("div",null);
  head.style.display="flex";head.style.justifyContent="space-between";head.style.alignItems="center";
  head.appendChild(el("h3",null,"⭐ 生词闪卡"));
  const closeBtn=el("button","btn btn-plain btn-small","关闭");
  head.appendChild(closeBtn);
  c.appendChild(head);
  const prog=el("div","muted");
  c.appendChild(prog);
  const fc=el("div","fc");
  const inner=el("div","fc-inner");
  const front=el("div","fc-face");
  const back=el("div","fc-face fc-back");
  inner.append(front,back);fc.appendChild(inner);
  c.appendChild(fc);
  const nav=el("div","modal-actions");
  const prev=el("button","btn btn-plain","← 上一个");
  const next=el("button","btn btn-primary","下一个 →");
  nav.append(prev,next);
  c.appendChild(nav);
  function paint(){
    const e=entries[idx];
    prog.textContent="第 "+(idx+1)+"/"+entries.length+" 张 · 点击卡片翻面";
    front.textContent="";
    front.appendChild(el("div","fc-word",e.word));
    front.appendChild(el("div","d-py",e.pinyin));
    front.appendChild(el("div","fc-hint","点一点，看意思"));
    back.textContent="";
    back.appendChild(el("div",null,e.definition));
    if(e.synonyms.length)back.appendChild(el("div","muted","近义词："+e.synonyms.map(function(s){return s.word;}).join("、")));
    if(e.antonyms.length)back.appendChild(el("div","muted","反义词："+e.antonyms.map(function(s){return s.word;}).join("、")));
    fc.classList.remove("flipped");
  }
  fc.addEventListener("click",function(){fc.classList.toggle("flipped");});
  prev.addEventListener("click",function(){idx=(idx-1+entries.length)%entries.length;paint();});
  next.addEventListener("click",function(){idx=(idx+1)%entries.length;paint();});
  paint();
  const close=openModal(c);
  closeBtn.addEventListener("click",close);
}

/* ---------- 词卡打印（P6/F25） ---------- */
function printCards(words){
  const layer=$("#print-layer");layer.textContent="";
  for(let p=0;p<words.length;p+=8){
    const page=el("div","print-page");
    words.slice(p,p+8).forEach(function(e){
      const card=el("div","print-card");
      card.appendChild(el("div","pc-word",e.word));
      card.appendChild(el("div","pc-py",e.pinyin));
      const syns=e.synonyms.slice(0,2).map(function(s){return s.word;}).join("、");
      const ants=e.antonyms.slice(0,2).map(function(s){return s.word;}).join("、");
      card.appendChild(el("div","pc-line","近义词："+(syns||"—")));
      card.appendChild(el("div","pc-line","反义词："+(ants||"—")));
      if(e.examples.length)card.appendChild(el("div","pc-ex","例："+e.examples[0]));
      card.appendChild(el("div","pc-corner","词语小侦探"));
      page.appendChild(card);
    });
    layer.appendChild(page);
  }
  setTimeout(function(){window.print();},50);
}

/* ---------- 导出 / 导入（P0-F13） ---------- */
function exportData(){
  const data={
    app:"词语小侦探",version:STORE.VERSION,exportedAt:new Date().toISOString(),
    data:{
      favorites:getFavorites(),wrong:getWrong(),history:getHistory(),
      streak:getStreak(),badges:getBadges(),totals:getTotals(),
      recent:getRecent(),mastered:getMastered(),settings:getSettings()
    }
  };
  try{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="词语小侦探备份-"+todayStr().replace(/-/g,"")+".json";
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a);},200);
    toast("已导出备份文件");
  }catch(e){toast("导出失败，请重试");}
}
function importData(fileInput){
  const f=fileInput.files&&fileInput.files[0];
  fileInput.value="";
  if(!f)return;
  const reader=new FileReader();
  reader.onload=function(){
    let obj=null;
    try{obj=JSON.parse(reader.result);}catch(e){}
    if(!obj||!obj.data||!Array.isArray(obj.data.favorites)){
      toast("文件格式不对，请选择本软件导出的 JSON");
      return;
    }
    confirmModal("导入备份？","导入会覆盖当前的学习数据（收藏、错题、统计），确定继续吗？","导入",function(){
      const d=obj.data;
      STORE.save("favorites",Array.isArray(d.favorites)?d.favorites:[]);
      STORE.save("wrong",(d.wrong&&typeof d.wrong==="object")?d.wrong:{});
      STORE.save("history",(d.history&&typeof d.history==="object")?d.history:{});
      STORE.save("streak",(d.streak&&typeof d.streak==="object")?d.streak:{current:0,longest:0,lastDate:""});
      STORE.save("badges",Array.isArray(d.badges)?d.badges:[]);
      STORE.save("totals",(d.totals&&typeof d.totals==="object")?d.totals:{});
      STORE.save("recent",Array.isArray(d.recent)?d.recent:[]);
      STORE.save("mastered",(d.mastered&&typeof d.mastered==="object")?d.mastered:{});
      STORE.save("settings",(d.settings&&typeof d.settings==="object")?d.settings:{});
      applyTheme(getSettings().theme);
      route();
      toast("导入成功，数据已恢复");
    });
  };
  reader.readAsText(f);
}

/* ---------- 深色主题 / 首次引导 / 启动 ---------- */
function applyTheme(theme){
  document.documentElement.dataset.theme=theme==="dark"?"dark":"light";
}
function maybeOnboard(){
  if(STORE.load("onboarded",false))return;
  const steps=[
    {ico:"🔎",t:"第 1 步 · 查词",d:"输入汉字、拼音或首字母都能找到词。每个近义词旁边都有一句“怎么用”的提示。"},
    {ico:"⚖️",t:"第 2 步 · 辨析",d:"两个词到底差在哪？五维对比表，加上同一个场景的两种说法，一眼看懂。"},
    {ico:"🎯",t:"第 3 步 · 闯关",d:"每天 5 题一小关。答错的词自动进错题本，连续答对 2 次就算掌握。"}
  ];
  let i=0;
  const c=el("div");
  const ico=el("div","ob-ico"),tt=el("div","ob-t"),dd=el("div","ob-d");
  const dots=el("div","ob-dots");
  steps.forEach(function(){dots.appendChild(el("span","ob-dot"));});
  const act=el("div","modal-actions");
  const prev=el("button","btn btn-plain","上一步");
  const next=el("button","btn btn-primary","下一步");
  act.append(prev,next);
  c.append(ico,tt,dd,dots,act);
  function paint(){
    ico.textContent=steps[i].ico;tt.textContent=steps[i].t;dd.textContent=steps[i].d;
    dots.childNodes.forEach(function(d,j){d.classList.toggle("on",j===i);});
    prev.style.visibility=i===0?"hidden":"visible";
    next.textContent=i===steps.length-1?"开始使用 ✓":"下一步";
  }
  prev.addEventListener("click",function(){if(i>0){i--;paint();}});
  next.addEventListener("click",function(){
    if(i<steps.length-1){i++;paint();return;}
    STORE.save("onboarded",true);
    close();toast("准备好了！从查一个词开始吧 🔍");
  });
  paint();
  const close=openModal(c);
}
const VIEW_RENDER={
  search:renderSearch,contrast:renderContrast,quiz:renderQuiz,
  browse:renderBrowse,me:renderMe
};
function init(){
  STORE.init();
  applyTheme(getSettings().theme);
  window.addEventListener("hashchange",route);
  if(!location.hash){
    try{history.replaceState(null,"","#/search");}catch(e){location.hash="#/search";}
  }
  const hc=document.querySelector("#hero-word-count");

    const si=document.querySelector("#search-input");
    if(si)si.placeholder="输入词语、拼音或首字母…";
  }
  bindSearchInput();
  route();
  maybeOnboard();
  window.selfTestQuiz=QUIZ_ENGINE.selfTestQuiz;   /* 开发者自检入口 */
}
try{

    banner.textContent="软件启动遇到了一点小问题，请刷新页面再试一次。";
    document.body.insertBefore(banner,document.body.firstChild);
  })();
}
